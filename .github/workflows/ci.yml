name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can read the repo and nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved
      # or hijacked tag cannot change the code that runs in our CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json says, and fails if it
      # is out of sync with package.json.
      - run: npm ci

      # Public eval datasets, cached by their pinned revision. The fetch script verifies the
      # SHA-256 either way, so a cached file can be trusted as much as a fresh download.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/data/gretel
          key: eval-data-gretel-e06eb1499ca8d54470f085021cd8e54f9efac7fd

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/data/cuad/CUAD_v1.json
          key: eval-data-cuad-a3c393f5d103fd0c516374e4fdff676c8176dcb1

      - run: npm run fetch:gretel -w @lexguard/evals
      # 40 MB; needed for the clause-integrity gate (evals/cuad/chunking.test.ts).
      - run: npm run fetch:cuad -w @lexguard/evals

      - run: npm run check

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so leaks in old commits are found too
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
