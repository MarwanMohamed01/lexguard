version: 2
updates:
  # npm dependencies for the whole workspace (root package-lock.json).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA-pinned GitHub Actions in ci.yml up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
